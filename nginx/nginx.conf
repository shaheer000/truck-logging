# Replace `api.example.com` with your real EC2 domain (or the Elastic IP's
# reverse-DNS / a Route 53 record you control). The HTTPS block assumes you
# dropped a fullchain + privkey into ./certs/ via certbot (see DEPLOY.md).

upstream django_backend {
    server backend:8000;
}

# HTTP → HTTPS redirect. If you don't have a TLS cert yet, comment out the
# HTTPS server block and let nginx serve the API directly over :80.
server {
    listen 80;
    server_name api.example.com;

    # Let's Encrypt HTTP-01 challenge path (if you renew with certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    location / {
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
