# docker-compose for the TruckLog Pro backend on EC2.
# Usage:
#   1. Copy backend/.env.example to backend/.env and fill in real values.
#   2. docker compose up -d --build
#   3. Point your Vercel frontend at https://<ec2-domain>/api
#
# Services:
#   db       — Postgres 16, data persisted in the `pg_data` volume.
#   backend  — Django + Gunicorn, exposed only on the internal network.
#   nginx    — TLS-terminating reverse proxy. Mount your certs into ./certs.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trucklog}
      POSTGRES_USER: ${POSTGRES_USER:-trucklog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trucklog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      USE_POSTGRES: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  pg_data:
